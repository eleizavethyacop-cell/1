name: Build ScreenComment.exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build EXE
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE /DWIN32 /D_WINDOWS /SUBSYSTEM:WINDOWS ScreenComment.cpp user32.lib gdi32.lib /Fe:ScreenComment.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ScreenComment
          path: ScreenComment.exe
